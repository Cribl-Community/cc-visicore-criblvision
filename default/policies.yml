# Product API access declaration for CriblVision.
# At install time, admins see exactly which platform resources the app will use.
# All monitoring calls are read-only; the only writes are behind the Alerts page:
# Notification CRUD (native Cribl notifications) and the scheduled searches the
# alert catalog creates in Cribl Search.

policies:
  # Worker groups / edge fleets inventory
  - object: '/master/groups'
    actions: ['GET']
  - object: '/master/groups/*'
    actions: ['GET']

  # Worker & edge node health, CPU/mem/disk, versions
  - object: '/master/workers'
    actions: ['GET']
  - object: '/master/summary/workers'
    actions: ['GET']

  # Internal throughput / volume / dropped-event metrics
  - object: '/system/metrics/query'
    actions: ['POST']

  # Leader/system info and daily license usage (for the Data Value dashboard)
  - object: '/system/info'
    actions: ['GET']
  - object: '/system/licenses/usage'
    actions: ['GET']

  # License quota, for the headroom projection on the Data Value dashboard
  - object: '/system/licenses'
    actions: ['GET']

  # Per-node CPU/memory history for the Worker Nodes sparklines.
  # Worker (/w/:wid) requests are authorized against the group-equivalent path,
  # so both must be declared.
  - object: '/w/:wid/system/metrics'
    actions: ['GET']
  - object: '/m/:gid/system/metrics'
    actions: ['GET']

  # System notifications (errors / warnings / info) for the Notifications page
  - object: '/system/messages'
    actions: ['GET']

  # Internal-log search, for the Log Analytics page (level/channel/message
  # breakdown) — searches the Leader's own log plus each worker group's log.
  - object: '/system/logs/search'
    actions: ['GET']

  # Git-backed config commit history, for the Commit Audit Log page.
  - object: '/version'
    actions: ['GET']
  - object: '/version/show'
    actions: ['GET']

  # Per-group Source and Destination config + authoritative runtime health
  # (status.health on these endpoints reflects real connection health)
  - object: '/m/:gid/system/inputs'
    actions: ['GET']
  - object: '/m/:gid/system/outputs'
    actions: ['GET']
  - object: '/m/:gid/system/status/inputs'
    actions: ['GET']
  - object: '/m/:gid/system/status/outputs'
    actions: ['GET']
  - object: '/m/:gid/health'
    actions: ['GET']
  - object: '/health'
    actions: ['GET']

  # Collection & scheduled job status + per-run task errors for the Collectors page
  - object: '/m/:gid/jobs'
    actions: ['GET']
  - object: '/m/:gid/jobs/*'
    actions: ['GET']

  # Email Alerts page — CriblVision manages native Cribl Notifications wired to the
  # SMTP notification target; Cribl evaluates conditions and sends the email.
  # POST lets the Alerts page create webhook targets (for example ServiceNow) that
  # alerts are then sent to; the Leader does the posting, never the app.
  - object: '/notification-targets'
    actions: ['GET', 'POST']
  # DELETE removes webhook targets from the same page (never the built-in
  # system_email / system_notifications targets).
  - object: '/notification-targets/*'
    actions: ['GET', 'DELETE']
  - object: '/m/:gid/notifications'
    actions: ['GET', 'POST']
  - object: '/m/:gid/notifications/*'
    actions: ['GET', 'PATCH', 'DELETE']

  # Alert catalog — CriblVision creates scheduled searches in Cribl Search (always
  # the default_search group) with an email notification, and reads the existing
  # ones to show their status and P1/P2/P3 label.
  - object: '/m/:gid/search/saved'
    actions: ['GET', 'POST']
  - object: '/m/:gid/search/saved/*'
    actions: ['GET', 'POST', 'PATCH', 'DELETE']

  # Alert drill-in — "Run search" executes an alert's query once in Cribl Search
  # and shows the rows inline, so its logic can be checked or edited safely.
  - object: '/m/:gid/search/jobs'
    actions: ['POST']
  - object: '/m/:gid/search/jobs/*'
    actions: ['GET']

  # Source / Destination drill-in — reads what a group's nodes logged about one
  # Source or Destination (the reason it is unhealthy lives in the node's own log).
  # Worker requests are authorized against the group-equivalent path.
  - object: '/w/:wid/system/logs/*'
    actions: ['GET']
  - object: '/m/:gid/system/logs/*'
    actions: ['GET']
